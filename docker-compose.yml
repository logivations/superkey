version: '3.8'

services:
  superkey:
    build: .
    expose:
      - "3000"
    # Host-local only: the deploy runner (systemd timer on this host) talks
    # to the API without going through caddy.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./credentials.json:/app/credentials.json:ro
      - /root/hostnames:/root/hostnames:ro
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      - GOOGLE_SERVICE_ACCOUNT_KEY=/app/credentials.json
      - GOOGLE_ADMIN_EMAIL=${GOOGLE_ADMIN_EMAIL}
      - SESSION_SECRET=${SESSION_SECRET}
      # Machine token for nemo team-agent auto-registration
      # (POST /api/agents/register). Empty = agent API disabled.
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
      # Deploy runner auth + the machine public key served at /api/deploy-key.
      # Both written into .env by scripts/setup-deploy-runner.sh.
      - DEPLOY_API_TOKEN=${DEPLOY_API_TOKEN:-}
      - DEPLOY_PUBKEY=${DEPLOY_PUBKEY:-}
      - NODE_ENV=production
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - superkey
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
